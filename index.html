<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Документы</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231c1c1e'/%3E%3Ctext x='32' y='45' font-family='Arial' font-size='34' font-weight='700' fill='%23fff' text-anchor='middle'%3EДК%3C/text%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>

<style>
/* ============ ПЕРЕМЕННЫЕ / БАЗА ============ */
:root{
  --bg:#f5f5f7;
  --card:#fff;
  --text:#1c1c1e;
  --muted:#8e8e93;
  --line:#e5e5ea;
  --dark:#1c1c1e;
  --yellow:#e8f56b;
  --blue:#cfe0ff;
  --pink:#ffd6e7;
  --radius:24px;
  --shadow:0 4px 24px rgba(20,20,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}

/* ============ ВХОД ============ */
.login-screen{
  position:fixed;inset:0;z-index:100;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#e9e9ef,#f7f7fa);padding:20px;
}
.login-screen.hidden{display:none}
.login-card{
  width:100%;max-width:360px;background:#fff;border-radius:28px;
  padding:36px 28px;box-shadow:0 24px 60px rgba(0,0,0,.10);
}
.login-logo{
  width:56px;height:56px;border-radius:16px;background:var(--dark);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;
  margin-bottom:18px;
}
.login-card h2{font-size:22px;margin:0 0 22px}
.login-error{display:none;margin-bottom:12px;padding:10px 12px;border-radius:12px;
  background:#ffe9e9;color:#a21b1b;font-size:12.5px}
.login-error.show{display:block}

/* ============ ПОЛЯ ============ */
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px;color:#3a3a3c}
.field input,.field select{
  width:100%;padding:12px 14px;font-size:14px;font-family:inherit;
  border:1px solid var(--line);border-radius:14px;background:#fafafc;
  outline:none;transition:.15s;color:var(--text);
}
.field input:focus,.field select:focus{
  background:#fff;border-color:#b8b8c0;box-shadow:0 0 0 3px rgba(0,0,0,.04);
}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ============ КНОПКИ ============ */
.btn-primary{
  width:100%;padding:13px 18px;font-size:15px;font-weight:600;
  background:var(--dark);color:#fff;border:none;border-radius:16px;
  cursor:pointer;transition:.15s;font-family:inherit;
}
.btn-primary:hover:not(:disabled){background:#000}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}

.btn-ghost{
  padding:10px 16px;font-size:13px;font-weight:500;font-family:inherit;
  background:transparent;color:var(--text);
  border:1px solid var(--line);border-radius:999px;cursor:pointer;transition:.15s;
}
.btn-ghost:hover:not(:disabled){background:#fff;box-shadow:var(--shadow)}
.btn-ghost:disabled{opacity:.4;cursor:not-allowed}

/* ============ ПРИЛОЖЕНИЕ ============ */
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.app.hidden{display:none}

.sidebar{
  background:#fbfbfd;border-right:1px solid var(--line);
  padding:22px 16px;display:flex;flex-direction:column;gap:22px;
}
.sidebar-brand{display:flex;align-items:center;gap:12px;padding:0 8px}
.sidebar-brand .mark{
  width:42px;height:42px;border-radius:14px;background:var(--dark);
  display:flex;align-items:center;justify-content:center;font-size:22px;
}
.sidebar-brand .title{font-size:14px;font-weight:600;line-height:1.2}

.nav{display:flex;flex-direction:column;gap:4px}
.nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--muted);padding:4px 8px 6px}
.nav-btn{
  text-align:left;padding:11px 16px;background:transparent;border:none;
  border-radius:999px;font-family:inherit;font-size:13.5px;font-weight:500;
  color:#3a3a3c;cursor:pointer;transition:.15s;
}
.nav-btn:hover{background:#fff}
.nav-btn.active{background:var(--dark);color:#fff}

.sidebar-user{margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}

/* ============ MAIN ============ */
.main{padding:32px 40px;overflow:auto}
.page-head{margin-bottom:28px}
.page-head h1{font-size:44px;line-height:1.05;letter-spacing:-.02em;margin:0 0 8px}
.page-head .sub{color:var(--muted);font-size:14px}

/* ============ СЕТКА КАРТОЧЕК ============ */
.dash-grid{display:grid;gap:20px;grid-template-columns:repeat(12,1fr)}
.card{
  background:var(--card);border-radius:var(--radius);
  padding:24px;box-shadow:var(--shadow);
}
.span-4{grid-column:span 4}
.span-5{grid-column:span 5}
.span-6{grid-column:span 6}
.span-7{grid-column:span 7}
.span-8{grid-column:span 8}
.span-12{grid-column:span 12}

@media (max-width:1200px){
  .span-4,.span-5,.span-6,.span-7,.span-8{grid-column:span 12}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{flex-direction:row;overflow-x:auto;border-right:none;
    border-bottom:1px solid var(--line);gap:8px;padding:14px}
  .sidebar-brand{display:none}
  .nav{flex-direction:row}
  .nav-label{display:none}
  .sidebar-user{margin:0;padding:0;border:none}
  .main{padding:20px}
  .page-head h1{font-size:32px}
}

/* ============ ПЛАШКИ / СТАТУСЫ ============ */
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;
  border-radius:999px;font-size:11.5px;font-weight:600}
.chip.yellow{background:var(--yellow)}
.chip.blue{background:var(--blue)}
.chip.pink{background:var(--pink)}

.status{margin-top:14px;padding:12px 14px;border-radius:14px;
  font-size:12.5px;line-height:1.5;display:none}
.status.show{display:block}
.status.ok{background:#eefbe9;color:#226b1e}
.status.warn{background:#fff6e0;color:#8a5a00}
.status.err{background:#ffe9e9;color:#a21b1b}

/* ============ ПРЕВЬЮ ДОКУМЕНТА ============ */
.sheet{
  width:100%;aspect-ratio:210/297;overflow:auto;background:#fff;
  border-radius:16px;border:1px solid var(--line);padding:7% 7% 7% 8%;
}
.paper{font-family:"Times New Roman",serif;font-size:12pt;line-height:1.5;color:#000}
.paper p{margin:0}
.empty-hint{color:var(--muted);text-align:center;margin-top:90px;font-size:14px}

/* ============ ПРЕВЬЮ ПРАЙСА ============ */
.price-table-wrap{
  width:100%;max-height:72vh;overflow:auto;background:#fff;
  border:1px solid var(--line);border-radius:16px;
}
.price-table{border-collapse:collapse;font-size:12px;white-space:nowrap;min-width:100%}
.price-table th,.price-table td{
  padding:7px 10px;border-bottom:1px solid #eef1f6;border-right:1px solid #f1f5f9;
  text-align:left;vertical-align:top;max-width:260px;overflow:hidden;text-overflow:ellipsis;
}
.price-table th{background:#f1f5f9;font-weight:600;position:sticky;top:0;z-index:1}
.price-table tr:hover td{background:#f8fafc}
.price-table .row-num{color:#94a3b8;background:#f8fafc;position:sticky;left:0;z-index:1}
.price-table th.row-num{z-index:2}
</style>
</head>
<body>

<!-- ================= ВХОД ================= -->
<div class="login-screen" id="loginScreen">
  <form class="login-card" id="loginForm">

<!-- ================= ПРИЛОЖЕНИЕ ================= -->
<div class="app hidden" id="app">
  <aside class="sidebar">

</div>

<!-- ===================================================== -->
<!--           ШАБЛОНЫ МОДУЛЕЙ (HTML каждого)              -->

<!-- МОДУЛЬ 1: ВЫВОД КОДОВ ЧЗ -->

<!-- ================= JS ================= -->
<script>
/* =====================================================
   USERS.JS  (внутри файла)
   ===================================================== */
window.APP_USERS = {
  admin: {
    password: "admin",
    name: "Администратор",
    views: ["codes","vacation","otgul","price"]
  },
  user: {
    password: "user",
    name: "Пользователь",
    views: ["codes","otgul"]
  }
};

/* =====================================================
   COMMON — утилиты
   ===================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '')
  .replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTHS_NOM = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];

function formatDateRu(iso){
  if (!iso) return '';
  const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return iso;
  return `«${m[3]}» ${MONTHS_GEN[+m[2]-1]} ${m[1]} г.`;
}
function isoToRu(iso){
  const m = String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? `${m[3]}.${m[2]}.${m[1]}` : iso;
}
function firstOfMonthISO(iso){
  const m = String(iso||'').match(/^(\d{4})-(\d{2})/);
  return m ? `${m[1]}-${m[2]}-01` : '';
}

function downloadDoc(html, filename){
  const head = `<html xmlns:o="urn:schemas-microsoft-com:office:office"
    xmlns:w="urn:schemas-microsoft-com:office:word"
    xmlns="http://www.w3.org/TR/REC-html40">
    <head><meta charset="utf-8"><title>Документ</title>
    <style>
      @page{size:A4;margin:2cm 2cm 2cm 2.5cm}
      body{font-family:"Times New Roman",serif;font-size:12pt;line-height:1.5}
      p{margin:0}
      table{width:100%;border-collapse:collapse}
      td{vertical-align:top;padding:0}
    </style></head><body>`;
  const blob = new Blob(['\ufeff' + head + html + '</body></html>'],
    {type:'application/msword;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}

function openPrint(html, title){
  const w = window.open('', '_blank');
  w.document.write(`<html><head><meta charset="utf-8"><title>${title}</title>
    <style>
      @page{size:A4;margin:2cm 2cm 2cm 2.5cm}
      body{font-family:"Times New Roman",serif;font-size:12pt;line-height:1.5}
      p{margin:0}
    </style></head><body>${html}</body></html>`);
  w.document.close(); w.focus();
  setTimeout(() => w.print(), 300);
}

/* =====================================================
   APP — авторизация, навигация, модули
   ===================================================== */
const USERS = window.APP_USERS;
const SESSION_KEY = 'dk_session_login';
let currentUser = null;

const loginScreen = $('loginScreen');
const loginForm   = $('loginForm');
const loginError  = $('loginError');
const appEl       = $('app');
const mainEl      = $('mainContent');

function showErr(msg){
  loginError.textContent = msg || '';
  loginError.classList.toggle('show', !!msg);
}

/* --- РЕЕСТР МОДУЛЕЙ ---
   Каждый модуль = объект { html, init }
   html — id <template>, init — функция привязки событий.
*/
const MODULES = {
  codes:    { tpl: 'tpl-codes',    init: initCodes },
  vacation: { tpl: 'tpl-vacation', init: initVacation },
  otgul:    { tpl: 'tpl-otgul',    init: initOtgul },
  price:    { tpl: 'tpl-price',    init: initPrice }
};

const initialized = new Set();

function switchModule(name){
  if (currentUser) {
    const u = USERS[currentUser];
    if (!u || !u.views.includes(name)) return;
  }
  document.querySelectorAll('.nav-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.module === name));

  const mod = MODULES[name];
  if (!mod) return;

  // вставляем HTML из шаблона
  const tpl = document.getElementById(mod.tpl);
  mainEl.innerHTML = '';
  mainEl.appendChild(tpl.content.cloneNode(true));

  // init вызываем один раз на модуль (или каждый раз — на ваш выбор)
  mod.init();
}

function applySession(){
  const user = USERS[currentUser];
  if (!user) return;
  loginScreen.classList.add('hidden');
  appEl.classList.remove('hidden');
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.style.display = user.views.includes(btn.dataset.module) ? '' : 'none';
  });
  $('sidebarUserName').textContent = user.name;
  const first = [...document.querySelectorAll('.nav-btn')]
    .find(b => b.style.display !== 'none');
  if (first) switchModule(first.dataset.module);
}

function logout(){
  localStorage.removeItem(SESSION_KEY);
  currentUser = null;
  appEl.classList.add('hidden');
  loginScreen.classList.remove('hidden');
  loginForm.reset();
  showErr('');
  $('loginUser').focus();
}

loginForm.addEventListener('submit', e => {
  e.preventDefault();
  const login = $('loginUser').value.trim().toLowerCase();
  const pass  = $('loginPass').value;
  const user  = USERS[login];
  if (!login) { showErr('Введите логин.'); return; }
  if (!user)  { showErr('Пользователь не найден.'); return; }
  if (user.password && user.password !== pass) { showErr('Неверный пароль.'); return; }
  currentUser = login;
  localStorage.setItem(SESSION_KEY, login);
  $('loginPass').value = '';
  applySession();
});

$('btnLogout').addEventListener('click', logout);
document.querySelectorAll('.nav-btn').forEach(btn =>
  btn.addEventListener('click', () => switchModule(btn.dataset.module)));

// восстановление сессии
(function(){
  const saved = localStorage.getItem(SESSION_KEY);
  if (saved && USERS[saved]) { currentUser = saved; applySession(); }
  else { $('loginUser').focus(); }

  const EMOJI = ['🐶','🐱','🐭','🐹','🐰','🐻','🐼','🐨','🐯','🦁'];
  $('sidebarAvatar').textContent = EMOJI[Math.floor(Math.random()*EMOJI.length)];
})();

/* =====================================================
   МОДУЛЬ 1: ВЫВОД КОДОВ ЧЗ  (продолжение)
   ===================================================== */
function initCodes(){
  codesLastCompany = null;
  codesLastHtml = '';

  const apiMsg = $('apiMsg');

  function setMsg(text, kind){
    apiMsg.textContent = text || '';
    apiMsg.className = 'status' + (text ? ' show ' + (kind||'') : '');
  }

  function shortFio(full){
    const p = String(full||'').trim().split(/\s+/).filter(Boolean);
    if (p.length < 2) return full;
    return p[0] + ' ' + p.slice(1).map(w => w[0].toUpperCase()+'.').join('');
  }

  async function fetchCompany(inn){
    const isIp = String(inn).length === 12;
    const url = (isIp ? URL_IP : URL_COMPANY) +
      '?key=' + encodeURIComponent(CHECKO_KEY) +
      '&inn=' + encodeURIComponent(inn);
    const r = await fetch(url);
    if (!r.ok) throw new Error('Сервис вернул код ' + r.status);
    const j = await r.json();
    if (!j || !j.meta || j.meta.status !== 'ok')
      throw new Error((j?.meta?.message) || 'Компания не найдена');
    return { data: j.data, isIp };
  }

  function buildLetter(d){
    const v = k => esc(d[k] || '____________');
    return `
      <p style="margin-bottom:8px"><b>${v('client')}</b><br>
      ИНН ${v('inn')}${d.isIp ? '' : ' / КПП ' + v('kpp')}<br>
      Адрес: ${v('address')}</p>
      <p style="text-align:right;margin-top:12px">Управляющему ООО «ПРОЕКТ 111»<br>
      Генеральному директору<br>Цибину Н.А.</p>
      <h2 style="text-align:center;font-size:12pt;margin:36px 0 24px">Информационное письмо</h2>
      <p style="text-indent:1.25cm;text-align:justify;margin-bottom:12px">
        Мы, ${v('client')} (ИНН ${v('inn')}), настоящим письмом информируем,
        что товар с кодами маркировки, приобретаемый по УПД/счёту
        № ${v('invoice')} от ${v('invdate')}, будет использован исключительно
        для собственных нужд нашей организации и не предназначен для дальнейшей
        реализации (перепродажи) третьим лицам.
      </p>
      <p style="text-indent:1.25cm;text-align:justify">
        В связи с отсутствием факта последующей перепродажи просим не передавать
        коды маркировки в составе первичной документации и поручаем
        ООО «ПРОЕКТ 111» осуществить вывод кодов маркировки из оборота по схеме
        «На собственные нужды» самостоятельно, с обязательным указанием ИНН нашей
        организации — ${v('inn')}.
      </p>
      <p style="margin-top:48px">Дата: ${new Date().toLocaleDateString('ru-RU')}</p>
      <p style="margin-top:24px">${v('post')} / ${v('fio')}</p>
      <p>Подпись: ____________________</p>
      <p style="margin-top:24px">М.П.</p>
    `;
  }

  function render(){
    const d = {
      client : codesLastCompany?.client  || '',
      inn    : codesLastCompany?.inn     || $('innInput').value.trim(),
      kpp    : codesLastCompany?.kpp     || '',
      address: codesLastCompany?.address || '',
      post   : codesLastCompany?.post    || '',
      fio    : codesLastCompany?.fio     || '',
      invoice: $('orderInput').value.trim(),
      invdate: isoToRu($('dateInput').value),
      isIp   : !!codesLastCompany?.isEntrepreneur
    };
    codesLastHtml = buildLetter(d);
    $('paper').innerHTML = codesLastHtml;
    $('btnDownload').disabled = false;
    $('btnPrint').disabled = false;

    const need = [
      ['client','название'],['inn','ИНН'],
      ...(d.isIp ? [] : [['kpp','КПП']]),
      ['address','адрес'],['invoice','№ счёта'],['invdate','дата счёта']
    ];
    const miss = need.filter(([k]) => !d[k]).map(([,l]) => l);
    const st = $('status');
    st.style.display = 'block';
    if (!miss.length){
      st.className = 'status ok show';
      st.innerHTML = '✓ Готово: <b>' + need.map(([,l])=>l).join(', ') + '</b>';
    } else {
      st.className = 'status warn show';
      st.innerHTML = 'Не найдено: <b>' + miss.join(', ') + '</b>. Впишите вручную.';
    }
  }

  async function handleFind(){
    const inn = $('innInput').value.trim();
    if (!/^\d{10}$|^\d{12}$/.test(inn)){
      setMsg('ИНН должен содержать 10 или 12 цифр', 'err');
      return;
    }
    $('btnFind').disabled = true;
    $('btnFind').textContent = 'Поиск…';
    setMsg('Запрос к Checko…', 'warn');
    try {
      const { data, isIp } = await fetchCompany(inn);
      codesLastCompany = {
        client : data['НаимСокр'] || data['НаимПолн'] || '',
        inn    : data['ИНН'] || inn,
        kpp    : isIp ? '' : (data['КПП'] || ''),
        address: data['ЮрАдрес']?.['АдресРФ'] || '',
        post   : data['Руковод']?.['Должн'] || '',
        fio    : shortFio(data['Руковод']?.['ФИО'] || ''),
        isEntrepreneur: isIp
      };
      setMsg('✓ Найдено: ' + (codesLastCompany.client || '—'), 'ok');
      render();
    } catch(e){
      console.error(e);
      setMsg('✗ ' + (e.message || 'Ошибка'), 'err');
      $('status').style.display = 'none';
    } finally {
      $('btnFind').disabled = false;
      $('btnFind').textContent = 'Найти';
    }
  }

  // биндинги
  $('btnFind').addEventListener('click', handleFind);
  $('btnDownload').addEventListener('click', () => {
    if (codesLastHtml) downloadDoc(codesLastHtml, 'Информационное письмо.doc');
  });
  $('btnPrint').addEventListener('click', () => {
    if (codesLastHtml) openPrint(codesLastHtml, 'Информационное письмо');
  });
  $('btnClear').addEventListener('click', () => {
    ['innInput','orderInput','dateInput'].forEach(id => $(id).value = '');
    codesLastCompany = null; codesLastHtml = '';
    $('paper').innerHTML = '<div class="empty-hint">Заполните поля слева и нажмите «Найти»</div>';
    $('btnDownload').disabled = true;
    $('btnPrint').disabled = true;
    setMsg('');
    $('status').style.display = 'none';
  });
  $('innInput').addEventListener('input', e => {
    e.target.value = e.target.value.replace(/\D/g,'').slice(0,12);
  });
  $('innInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); handleFind(); }
  });
  if (!$('dateInput').value)
    $('dateInput').value = new Date().toISOString().slice(0,10);
}

function initVacation(){
  vacHtml = '';

  // заполняем месяцы
  const monthSel = $('vacPayMonth');

      o.textContent = name[0].toUpperCase() + name.slice(1);

  const now = new Date();
  $('vacPayMonth').value = now.getMonth() + 1;
  $('vacPayYear').value  = now.getFullYear();

  function collect(){
    return {
      fio        : $('vacFio').value,
      post       : $('vacPost').value,
      fromISO    : $('vacFrom').value,
      toISO      : $('vacTo').value,

  function build(d){

    return `

        ООО «ПРОЕКТ 111»<br>Цибину Николаю Анатольевичу</p>

        margin:36px 0;letter-spacing:.06em">СЛУЖЕБНАЯ ЗАПИСКА</h2>

        отдела новые рынки с ${dateFrom} по ${dateTo}, прошу возложить

      <p style="margin-top:24px">Руководитель</p>
      <p>________________________/Головко Н.Б./</p>
    `;

  function render(){
    const d = collect();
    vacHtml = build(d);

    $('btnVacPrint').disabled = false;

    if (!d.fromISO) miss.push('дата «с»');
    if (!d.toISO) miss.push('дата «по»');
    if (!d.replaceFio) miss.push('Кого заменял');
    if (!d.payYear) miss.push('год');

    const s = $('vacStatus');
    s.style.display = 'block';
    if (!miss.length){ s.className='status ok show'; s.textContent='✓ Записка готова.'; }
    else { s.className='status warn show'; s.innerHTML='Не заполнено: <b>'+miss.join(', ')+'</b>'; }

  $('btnVacDownload').addEventListener('click', () => {

  });
  $('btnVacPrint').addEventListener('click', () => {

    ['vacFio','vacPost','vacFrom','vacTo','vacReplace'].forEach(id => $(id).value='');

    $('btnVacDownload').disabled = true;
    $('btnVacPrint').disabled = true;
    $('vacStatus').style.display = 'none';
  });
}

/* =====================================================
   МОДУЛЬ 4: ОБРАБОТКА ПРАЙСА
   ===================================================== */
let priceFile = null;
let priceResult = null;

function initPrice(){
  priceFile = null;
  priceResult = null;

  // --- утилиты ---
  const normHeader = s => String(s ?? '').replace(/\u00A0/g,' ').replace(/\s+/g,' ').trim().toLowerCase();
  const normSimple = s => String(s ?? '').trim().toLowerCase();

  function findHeader(row, name){
    if (!row) return -1;
    const t = normHeader(name);
    for (let i = 0; i < row.length; i++) if (normHeader(row[i]) === t) return i;
    return -1;
  }

  function toNumber(v){
    if (v == null || v === '') return null;
    if (typeof v === 'number') return isFinite(v) ? v : null;
    let s = String(v).trim().replace(/[\s\u00A0]/g,'');
    if (!s) return null;
    const hasComma = s.includes(','), hasDot = s.includes('.');
    if (hasComma && hasDot){
      if (s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g,'').replace(',', '.');
      else s = s.replace(/,/g,'');
    } else if (hasComma){
      const n = (s.match(/,/g)||[]).length;
      s = n > 1 ? s.replace(/,/g,'') : s.replace(',', '.');
    }
    const x = parseFloat(s);
    return isNaN(x) ? null : x;
  }

  function readWorkbook(buf){
    const b = new Uint8Array(buf);
    if (b.length > 2 && b[0] === 0x50 && b[1] === 0x4B)
      return XLSX.read(buf, { type: 'array' });

    // csv
    let text;
    if (b[0] === 0xEF && b[1] === 0xBB && b[2] === 0xBF)
      text = new TextDecoder('utf-8').decode(b.subarray(3));
    else if (b[0] === 0xFF && b[1] === 0xFE)
      text = new TextDecoder('utf-16le').decode(b.subarray(2));
    else {
      try { text = new TextDecoder('utf-8',{fatal:true}).decode(b); }
      catch { text = new TextDecoder('windows-1251').decode(b); }
    }
    return XLSX.read(text, { type: 'string', raw: true });
  }

  function process(buf, margin, colName){
    const wb = readWorkbook(buf);
    const sheet = wb.SheetNames[0];
    if (!sheet) throw new Error('Нет листов в файле.');
    const data = XLSX.utils.sheet_to_json(wb.Sheets[sheet], { header:1, raw:true, defval:'' });
    if (!data.length) throw new Error('Лист пустой.');

    const staleCol = findHeader(data[0], 'Залежалость');
    const costCol  = findHeader(data[0], 'СС из прайса');
    const priceCol = findHeader(data[0], colName);
    if (staleCol < 0) throw new Error('Нет колонки «Залежалость».');
    if (costCol  < 0) throw new Error('Нет колонки «СС из прайса».');
    if (priceCol < 0) throw new Error('Нет колонки «' + colName + '».');

    let processed = 0;
    for (let r = 1; r < data.length; r++){
      const row = data[r]; if (!row) continue;
      const sv = normSimple(row[staleCol]);
      if (sv !== 'залежалый' && sv !== 'очень залежалый') continue;
      const cost = toNumber(row[costCol]); if (cost === null) continue;
      const calc = cost * (1 + margin / 100); if (!calc) continue;
      const cur  = toNumber(row[priceCol]);
      row[priceCol] = (cur === null || cur === 0) ? calc : Math.min(calc, cur);
      processed++;
    }

    // переименования
    const euCol = findHeader(data[0], 'Цена EU');
    if (euCol >= 0) data[0][euCol] = 'Цена РРЦ';
    data[0][priceCol] = 'Цена со скидкой';

    // удаления
    const toDelete = ['Опубликовано на сайте','Цена 18%','Цена 20%',
      'Цена специалиста','Цена магистра','Цена доцента','Цена проф.',
      'Цена гранд-проф.','Цена акад','Цена милл.','СС из прайса',
      'Залежалость','Режим закупки','ID артикула'];
    const delIdxs = toDelete.map(n => findHeader(data[0], n)).filter(i => i >= 0).sort((a,b)=>b-a);
    for (const idx of delIdxs)
      for (let r = 0; r < data.length; r++){
        const row = data[r];
        if (Array.isArray(row) && row.length > idx) row.splice(idx,1);
      }

    // артикул в строку
    const artCol = findHeader(data[0], 'Код артикула');
    if (artCol >= 0) for (let r = 1; r < data.length; r++){
      const row = data[r]; if (!row || row[artCol] == null) continue;
      if (typeof row[artCol] !== 'string') row[artCol] = String(row[artCol]);
    }

    const newWs = XLSX.utils.aoa_to_sheet(data);
    newWs['!cols'] = data[0].map(() => ({ wch: 12 }));
    ['Код артикула','Цена РРЦ','Цена со скидкой','Категория',
     'Подкатегория','Ссылка на товар','Кол-во на складе'].forEach(name => {
      const c = findHeader(data[0], name); if (c < 0) return;
      let maxLen = String(data[0][c]||'').length;
      for (let r = 1; r < data.length; r++){
        const row = data[r]; if (!row || row[c] == null) continue;
        maxLen = Math.max(maxLen, String(row[c]).length);
      }
      newWs['!cols'][c] = { wch: Math.min(maxLen+2, 60) };
    });

    // стиль выравнивания
    if (newWs['!ref']){
      const range = XLSX.utils.decode_range(newWs['!ref']);
      for (let R = range.s.r; R <= range.e.r; R++)
        for (let C = range.s.c; C <= range.e.c; C++){
          const addr = XLSX.utils.encode_cell({ r:R, c:C });
          if (newWs[addr]) newWs[addr].s = { alignment:{ horizontal:'left', vertical:'center' } };
        }
    }
    return { data, newWs, sheet, processed, deleted: delIdxs.length };
  }

  function renderPreview(res){
    const wrap = $('pricePreviewWrap');
    const rows = res.data;
    if (!rows.length){ wrap.innerHTML = '<div class="empty-hint">Нет данных</div>'; return; }
    const PREVIEW = 20;
    const shown = rows.slice(0, PREVIEW + 1);
    const th = '<th class="row-num">#</th>' +
      shown[0].map(h => '<th>' + esc(h ?? '') + '</th>').join('');
    const tbody = shown.slice(1).map((row,i) => {
      const tds = row.map(v => {
        let t = v == null ? '' : String(v);
        if (typeof v === 'number') t = String(v).replace('.', ',');
        return '<td title="'+esc(t)+'">'+esc(t)+'</td>';
      }).join('');
      return '<tr><td class="row-num">'+(i+1)+'</td>'+tds+'</tr>';
    }).join('');
    const more = rows.length > PREVIEW + 1
      ? '<div style="padding:10px 14px;color:#94a3b8;font-size:12px">… ещё '+(rows.length-PREVIEW-1)+' строк</div>'
      : '';
    wrap.innerHTML = '<table class="price-table"><thead><tr>'+th+'</tr></thead><tbody>'+tbody+'</tbody></table>'+more;
  }

  function setStatus(html, kind){
    const s = $('priceStatus');
    if (!html){ s.style.display='none'; s.innerHTML=''; return; }
    s.style.display = 'block';
    s.className = 'status ' + (kind||'') + ' show';
    s.innerHTML = html;
  }

  function handleProcess(){
    if (!priceFile) return;
    const margin = parseFloat($('priceMargin').value);
    if (isNaN(margin)){ setStatus('Некорректный процент наценки.', 'err'); return; }
    const colName = $('priceDiscount').value;
    $('btnPriceProcess').disabled = true;
    $('btnPriceProcess').textContent = 'Обработка…';
    setStatus('Читаем файл…', 'warn');

    const reader = new FileReader();
    reader.onload = e => {
      try {
        const res = process(e.target.result, margin, colName);
        priceResult = res;
        renderPreview(res);
        setStatus('✓ Готово. Категория: <b>'+esc(colName)+
          '</b>. Обработано: <b>'+res.processed+'</b>. Удалено столбцов: <b>'+res.deleted+'</b>.', 'ok');
        $('btnPriceDownload').disabled = false;
      } catch(err){
        console.error(err);
        setStatus('✗ ' + (err.message || 'Ошибка'), 'err');
        $('pricePreviewWrap').innerHTML =
          '<div class="empty-hint">Ошибка обработки</div>';
        $('btnPriceDownload').disabled = true;
      } finally {
        $('btnPriceProcess').disabled = false;
        $('btnPriceProcess').textContent = 'Обработать';
      }
    };
    reader.onerror = () => {
      setStatus('Не удалось прочитать файл.', 'err');
      $('btnPriceProcess').disabled = false;
      $('btnPriceProcess').textContent = 'Обработать';
    };
    reader.readAsArrayBuffer(priceFile);
  }

  $('priceFile').addEventListener('change', () => {
    priceFile = $('priceFile').files[0] || null;
    $('btnPriceProcess').disabled = !priceFile;
    $('btnPriceDownload').disabled = true;
    priceResult = null;
    setStatus('');
    if (!priceFile) $('pricePreviewWrap').innerHTML =
      '<div class="empty-hint">Загрузите файл и нажмите «Обработать»</div>';
  });

  $('btnPriceProcess').addEventListener('click', handleProcess);
  $('btnPriceDownload').addEventListener('click', () => {
    if (!priceResult) return;
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, priceResult.newWs, priceResult.sheet);
    XLSX.writeFile(wb, 'Прайс для Урсуса.xlsx', { cellStyles: true });
  });
  $('btnPriceClear').addEventListener('click', () => {
    priceFile = null; priceResult = null;
    $('priceFile').value = '';
    $('priceMargin').value = 20;
    $('priceDiscount').value = 'Цена милл.';
    $('btnPriceProcess').disabled = true;
    $('btnPriceDownload').disabled = true;
    $('pricePreviewWrap').innerHTML = '<div class="empty-hint">Загрузите файл и нажмите «Обработать»</div>';
    setStatus('');
  });
}
</script>
</body>
</html>
